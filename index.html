<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>دلار چنده؟</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                Tahoma,
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #f8fafc
                );
        }

        .card {

            width: 90%;
            max-width: 450px;

            background: white;

            padding: 35px 25px;

            border-radius: 25px;

            text-align: center;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.10);
        }

        h1 {
            margin-top: 0;
            font-size: 30px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        .price {

            font-size: 42px;

            font-weight: bold;

            margin: 20px 0;

            direction: ltr;
        }

        .unit {
            color: #666;
            font-size: 16px;
        }

        .status {

            margin-top: 20px;

            color: #777;

            font-size: 14px;
        }

        button {

            margin-top: 20px;

            padding: 12px 25px;

            border: none;

            border-radius: 12px;

            background: #111827;

            color: white;

            font-size: 15px;

            cursor: pointer;
        }

        button:active {
            transform: scale(0.97);
        }

    </style>

</head>


<body>


<div class="card">

    <h1>
        💵 دلار چنده؟
    </h1>

    <div class="subtitle">
        قیمت دلار آزاد
    </div>

    <div
        id="price"
        class="price"
    >
        در حال دریافت...
    </div>

    <div class="unit">
        ریال
    </div>

    <div
        id="status"
        class="status"
    >
        در حال دریافت اطلاعات...
    </div>

    <button onclick="getPrice()">
        🔄 بروزرسانی
    </button>

</div>


<script>


const GIST_URL =
    "https://gist.githubusercontent.com/mohammad123-98/975eb057747899e403301e3a882d9d9b/raw/dollar.json";


async function getPrice() {

    const priceElement =
        document.getElementById("price");

    const statusElement =
        document.getElementById("status");


    try {

        statusElement.innerText =
            "در حال دریافت قیمت...";


        const response =
            await fetch(
                GIST_URL + "?t=" + Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "خطا در دریافت اطلاعات"
            );

        }


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.error ||
                "خطای نامشخص"
            );

        }


        const price =
            String(data.price)
                .replace(/,/g, "")
                .replace(/٬/g, "");


        priceElement.innerText =
            Number(price).toLocaleString("fa-IR");


        if (data.updated_at) {

            const date =
                new Date(data.updated_at);


            statusElement.innerText =
                "آخرین بروزرسانی: " +
                date.toLocaleString("fa-IR");

        } else {

            statusElement.innerText =
                "قیمت با موفقیت دریافت شد";

        }


    } catch (error) {

        console.error(error);

        priceElement.innerText =
            "خطا";

        statusElement.innerText =
            "دریافت قیمت ناموفق بود";

    }

}


getPrice();


setInterval(
    getPrice,
    5 * 60 * 1000
);


</script>


</body>

</html>
